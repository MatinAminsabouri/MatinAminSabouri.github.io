<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070B12">
  <title>Matin AminSabouri — AI &amp; Backend Engineer (dotnet / AI Systems)</title>
  <meta name="description" content="Portfolio of Matin AminSabouri (متین امین صبوری) — Software Engineer specializing in dotnet Core, Python, RAG Architectures, AI Agents, MCP, Persian NLP, and Scalable Backend Systems.">
  <meta name="author" content="Matin AminSabouri">
  <meta property="og:title" content="Matin AminSabouri — AI &amp; Backend Engineer">
  <meta property="og:description" content="Software &amp; AI Systems Engineer with 3+ years experience building RAG, ASR, and enterprise backend architectures.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://matinaminsabouri.github.io/assets/images/myPic.jpg">
  <script>
    (function () {
      /* FOUC-free boot: apply persisted (or system) theme + language before first paint */
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#F8FAFC' : '#070B12');
        var l = localStorage.getItem('lang') === 'fa' ? 'fa' : 'en';
        document.documentElement.setAttribute('lang', l);
        document.documentElement.setAttribute('dir', l === 'fa' ? 'rtl' : 'ltr');
      } catch (e) { }
    })();
  </script>
  <link rel="shortcut icon" href="./assets/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Structure-only shell: all copy lives in assets/js/data.js and is
       rendered by script.js. Elements below hold data-i18n KEYS with
       intentionally empty bodies so content can never drift again. -->
  <noscript>
    <p style="max-width:600px;margin:24px auto;padding:16px;border:1px solid rgba(148,163,184,.25);border-radius:14px;background:#101725;color:#E6EDF7;font-family:sans-serif;font-size:14px;text-align:center;">
      This site requires JavaScript to render its content.<br>
      برای نمایش محتوای این سایت، جاوااسکریپت مرورگر باید فعال باشد.
    </p>
  </noscript>

  <main>

    <aside class="sidebar" data-sidebar>

      <div class="sidebar-info">

        <figure class="avatar-box">
          <img class="pic" src="./assets/images/myPic.jpg" alt="Matin AminSabouri" data-avatar-trigger>
        </figure>

        <div class="info-content">
          <h1 class="name" title="Matin AminSabouri">Matin AminSabouri</h1>
          <p class="persian-name">متین امین صبوری</p>

          <p class="title" data-i18n="tagline"></p>

          <p class="positioning" data-i18n="positioning"></p>

          <div class="status-row">
            <span class="status-dot" aria-hidden="true"></span>
            <span class="status-text" data-i18n="open_to_work"></span>
          </div>
        </div>

        <div class="controls" role="group" aria-label="Preferences" data-i18n-aria="a_prefs">

          <button class="controls-btn" data-theme-toggle aria-label="Toggle theme" data-i18n-aria="a_theme">
            <ion-icon name="moon-outline" class="ic-moon"></ion-icon>
            <ion-icon name="sunny-outline" class="ic-sun"></ion-icon>
          </button>

          <div class="lang-switch" role="group" aria-label="Language" data-i18n-aria="a_lang">
            <button class="lang-btn active" data-lang="en" aria-pressed="true">EN</button>
            <button class="lang-btn" data-lang="fa" aria-pressed="false">FA</button>
          </div>

        </div>

        <button class="info_more-btn" data-sidebar-btn aria-label="Show or hide contact details" data-i18n-aria="a_contacts">
          <span data-i18n="show_contacts"></span>
          <ion-icon name="chevron-down"></ion-icon>
        </button>

      </div>

      <div class="sidebar-info_more">
        <div class="sidebar-info_more-inner">

          <div class="separator"></div>

          <ul class="contacts-list" data-contacts></ul>

          <div class="separator"></div>

          <ul class="social-list" data-socials></ul>

        </div>
      </div>

    </aside>

    <div class="main-content">

      <nav class="navbar" aria-label="Primary" data-i18n-aria="a_nav">

        <ul class="navbar-list">

          <li class="navbar-item">
            <button class="navbar-link active" data-nav-link data-nav-target="about" data-i18n="nav_about" aria-current="page"></button>
          </li>

          <li class="navbar-item">
            <button class="navbar-link" data-nav-link data-nav-target="resume" data-i18n="nav_resume"></button>
          </li>

          <li class="navbar-item">
            <button class="navbar-link" data-nav-link data-nav-target="portfolio" data-i18n="nav_portfolio"></button>
          </li>

          <li class="navbar-item">
            <button class="navbar-link" data-nav-link data-nav-target="logs" data-i18n="nav_logs"></button>
          </li>

        </ul>

      </nav>

      <article class="about active" data-page="about">

        <header>
          <h2 class="article-title" data-i18n="about_title"></h2>
        </header>

        <div data-about-body></div>

      </article>

      <article class="resume" data-page="resume">

        <header>
          <h2 class="article-title" data-i18n="resume_title"></h2>

          <div class="resume-actions">
            <a href="./assets/MatinAminSabouri-Resume.pdf" target="_blank" rel="noopener noreferrer" class="btn btn--primary">
              <span data-i18n="view_resume"></span>
              <ion-icon name="arrow-forward-outline" class="btn-arrow"></ion-icon>
            </a>

            <a href="./assets/MatinAminSabouri-Resume.pdf" download class="btn btn--ghost">
              <ion-icon name="download-outline"></ion-icon>
              <span data-i18n="download"></span>
            </a>
          </div>
        </header>

        <div data-resume-body></div>

      </article>

      <article class="portfolio" data-page="portfolio">

        <header>
          <h2 class="article-title" data-i18n="portfolio_title"></h2>
        </header>

        <section class="projects">

          <div class="filter-select-box">

            <button class="filter-select" data-select>
              <div class="select-value" data-select-value></div>
              <div class="select-icon">
                <ion-icon name="chevron-down"></ion-icon>
              </div>
            </button>

            <ul class="select-list" data-select-list></ul>

          </div>

          <ul class="filter-list" aria-label="Filter projects by category" data-i18n-aria="a_filter" data-filter-list></ul>

          <ul class="project-list" data-project-list></ul>

        </section>

      </article>

      <article class="logs" data-page="logs">

        <header>
          <div class="logs-header">
            <h2 class="article-title" data-i18n="logs_title"></h2>
            <button class="btn btn--ghost btn--sm" data-logs-refresh aria-label="Refresh notes from Telegram" title="Refresh notes">
              <ion-icon name="refresh-outline" class="refresh-ic"></ion-icon>
              <span class="refresh-label" data-i18n="logs_refresh"></span>
            </button>
          </div>

          <p class="logs-sub" data-i18n="logs_sub"></p>
        </header>

        <section class="logs-feed">
          <div class="logs-grid" data-logs-grid></div>

          <div class="logs-footer">
            <a href="https://t.me/KhanAcademyy" target="_blank" rel="noopener noreferrer" class="btn btn--ghost">
              <ion-icon name="paper-plane-outline"></ion-icon>
              <span data-i18n="logs_subscribe"></span>
              <ion-icon name="arrow-forward-outline" class="btn-arrow"></ion-icon>
            </a>
          </div>
        </section>

      </article>

    </div>

  </main>

  <!-- Lightbox modal for avatar enlargement -->
  <div class="lightbox" id="avatarLightbox" role="dialog" aria-modal="true" aria-label="Profile picture enlarged view" hidden>
    <div class="lightbox-backdrop" tabindex="-1"></div>
    <button class="lightbox-close" aria-label="Close enlarged view">
      <ion-icon name="close-outline"></ion-icon>
    </button>
    <figure class="lightbox-figure">
      <img class="lightbox-img" src="" alt="">
      <figcaption class="lightbox-caption"></figcaption>
    </figure>
  </div>

  <script src="./assets/js/data.js"></script>
  <script src="./assets/js/script.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>

</html>
