  <script>
    (function () {
      /* FOUC-free boot: apply persisted (or system) theme + language before
         first paint. Language is URL-driven (?lang=fa) so a Persian link can
         be shared, then falls back to the stored choice. */
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#F8FAFC' : '#070B12');

        var q = new URLSearchParams(location.search).get('lang');
        var l = (q === 'fa' || q === 'en') ? q : (localStorage.getItem('lang') === 'fa' ? 'fa' : 'en');
        document.documentElement.setAttribute('lang', l);
        document.documentElement.setAttribute('dir', l === 'fa' ? 'rtl' : 'ltr');
      } catch (e) { }
    })();
  </script>
