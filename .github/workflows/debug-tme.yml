name: Debug Telegram markup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/debug-tme.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe candidate channel handles
        run: |
          node -e "
          const handles = ['KhanAcademyy','khanAcademyy','KhanAcademy','KhanAcademyIR','khanacademyy'];
          const fs = require('fs');
          const out = [];
          (async () => {
            for (const h of handles) {
              for (const prefix of ['s/','']) {
                const url = 'https://t.me/' + prefix + h;
                try {
                  const res = await fetch(url, { headers: { 'user-agent': 'Mozilla/5.0' } });
                  const html = await res.text();
                  const wraps = (html.match(/tgme_widget_message_wrap/g) || []).length;
                  const og = /<meta property=\"og:title\" content=\"([^\"]*)\"/.exec(html);
                  out.push({ url, status: res.status, wraps, ogTitle: og ? og[1] : null });
                } catch (e) { out.push({ url, error: String(e.message||e) }); }
              }
            }
            fs.writeFileSync('debug-tme.json', JSON.stringify(out, null, 2));
            console.log(JSON.stringify(out.filter(x=>x.wraps>0), null, 2));
          })();
          "

      - name: Commit sample
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f debug-tme.json
          git commit -m "chore: probe telegram handles" || echo "no changes"
          git push
