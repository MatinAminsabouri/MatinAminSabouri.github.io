name: Sync Telegram notes

on:
  schedule:
    # hourly — the channel posts a few times a week, so this keeps the
    # Notes tab within an hour of the source
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    # running on a change to the sync itself gives immediate feedback that
    # the parser still matches Telegram's markup. Path-filtered so the
    # bot's own commit (notes.json + cards + index.html) cannot re-trigger it.
    paths:
      - 'scripts/sync-notes.mjs'
      - 'scripts/build-notes-cards.mjs'
      - 'scripts/test-sync-parser.mjs'
      - '.github/workflows/sync-notes.yml'

permissions:
  contents: write

concurrency:
  group: sync-notes
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest posts from Telegram
        run: |
          set +e
          node scripts/sync-notes.mjs 2>&1 | tee /tmp/sync.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # surface the reason as an annotation: run logs need auth to
            # download, annotations do not, so this is the debuggable path
            tail -n 12 /tmp/sync.log | sed 's/^/::error::/'
            exit "$status"
          fi

      - name: Build dev-log cards
        id: cards
        run: |
          set +e
          node scripts/build-notes-cards.mjs 2>&1 | tee /tmp/cards.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # cards are derived from notes.json, so a failure here must never
            # block the notes sync — the status is surfaced twice: as an
            # annotation now, and as a red run after the commit step below
            tail -n 12 /tmp/cards.log | sed 's/^/::error::/'
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Rebuild prerendered page
        run: npm run build

      - name: Commit changes
        run: |
          paths="assets/data/notes.json index.html"
          if [ "${{ steps.cards.outputs.status }}" = "0" ]; then
            paths="$paths assets/data/notes.cards.json"
          fi
          if git diff --quiet -- $paths; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $paths
            git commit -m "chore: sync Telegram notes"
            git push
          fi
          # keep the run red when the cards build failed even though the
          # notes commit above succeeded — otherwise the drift would only
          # show up later as stale cards
          if [ "${{ steps.cards.outputs.status }}" != "0" ]; then
            exit 1
          fi
