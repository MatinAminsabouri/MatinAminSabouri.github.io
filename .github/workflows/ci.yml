name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build (icons + prerender + SEO files)
        run: npm run build

      - name: Fail if the committed build output is stale
        run: |
          if ! git diff --quiet; then
            echo "Build output is out of date. Run 'npm run build' and commit."
            git diff --stat
            exit 1
          fi

      - name: Static checks
        run: npm run check

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn answers bots with 999, and t.me is unreachable from some
          # networks — neither says anything about whether a link works for a
          # human. mailto: cannot be checked over HTTP.
          args: >-
            --no-progress
            --accept 200,206,429,999
            --exclude 't\.me'
            --exclude 'linkedin\.com'
            --exclude 'mailto:'
            --exclude 'web\.archive\.org'
            index.html
          fail: true
